# Snapshot of /home/natasha/RoboTwin/policy/pi05/deploy_policy.yml as used by this eval run.
# Basic experiment configuration (keep unchanged)
policy_name: null
task_name: null
task_config: null
ckpt_setting: null
seed: null
instruction_type: unseen

# Add Parameters You Need
train_config_name: null
model_name: null
checkpoint_id: 15000
pi0_step: 10

# ===== Contact-wrench trace length =====
# Rows of every `wrench.*` modality / `observation.wrench.*` column, one per **primitive step**.
# With `data_type.wrench: true` the env averages the end-effector contact wrench over the whole
# TOPP-interpolated trajectory each `take_action` runs -- 34-196 physics steps here (median 94 for
# a 0.02 rad joint delta) -- into a single row: the total contact impulse over that step divided
# by the time it took. One inference therefore drains exactly `pi0_step` rows, which is what this
# should be set to; leave the key out and the drivers derive it from `pi0_step`. A chunk cut short
# by success or `step_lim` drains fewer and is NaN-padded; a longer one keeps its most recent rows.
#
# It is an architecture key in all but name. The critic's obs shape is fixed when it is built, so
# a checkpoint warm-started from `critic_ckpt`, and any rollout dataset it was pretrained on, has
# to have been made with this same value. It also caps the env's in-memory log (~240 B per
# configured wrench modality per transition at 10, stored twice) and nothing else.
wrench_trace_len: 10

# Number of successful eval episodes to run.
test_num: 300

# ===== Periodic held-out evaluation (the best-checkpoint criterion) =====
# Every `eval_interval` completed episodes, the run pauses and re-plays a FIXED set of
# `eval_episodes` episodes with the policy frozen -- the pi0.5 sampler is frozen anyway, so what
# this freezes is the critic (QMFM or DSRL): no transition is stashed into the replay buffer and
# no TD update runs, and the guidance scale is left exactly where the ramp has it, so what is
# scored is the policy as it behaves right now. The resulting success rate is what decides which
# critic `online_value_critic_best.pkl` keeps.
#
# It is a better criterion than the `success_rate_ma` it replaces for the usual held-out reason:
# the training episodes are the ones the critic just learned from, and each is a *different*
# seed, so their moving average moves with which seeds came up as much as with the critic. The
# held-out set is the same episodes every time, so two scores differ by the critic.
#
# Fixed twice over. The seeds are the first `eval_episodes` the scripted expert can solve
# counting up from `eval_seed` -- the same feasibility gate the main loop applies, deterministic
# in `eval_seed`, found once and then carried in `resume_state.json`
# (each rejected seed is a full expert rollout). And the `random` module is reseeded from
# `eval_seed` for the duration, so every evaluation draws the same language instructions in the
# same order. Neither the run's own RNG streams nor its counters are disturbed: a held-out
# episode is not one of the `test_num` episodes the run was asked for, and does not appear in
# `_episode_results.csv`.
#
# Each evaluation appends a row to `_holdout_results.csv` (episode, critic_updates,
# guidance_scale, successes, success_rate, reward_mean, steps_mean) and logs `holdout/*` to W&B.
# Video and the debug recorders are off for these episodes.
#
# Cost is the honest objection: `eval_episodes` rollouts (plus, once, the expert passes that
# choose the seeds) every `eval_interval` episodes, so at 10/20 the run is ~50% longer. Set
# `eval_interval: 0` to turn it off, in which case the best checkpoint falls back to
# `success_rate_ma` over the training episodes exactly as before.
eval_interval: 20
eval_episodes: 10
# Where the held-out seed search starts. This is an ACTUAL seed, not a `seed`-style block index:
# the run's own episodes start at `100000 * (1 + seed)` and walk upward from there, one seed per
# candidate (so more than one per episode -- the expert gate rejects some).
#   null (default)  `100000 * (1 + seed) + 1000` -- the run's own block, 1000 seeds ahead of
#                   where it starts. That offset is the only thing keeping the two sets
#                   disjoint, and it is comfortable at `test_num: 300`; the driver prints a
#                   warning if a run ever walks up to it, after which the held-out episodes are
#                   episodes the critic has trained on and the score stops being a clean
#                   measurement.
#   <an integer>    start there instead. Raise it for a long run.
#
# It does NOT change what the scene looks like, and no choice of it can. Every domain-
# randomization draw that decides the environment -- wall and table texture, light colors, table
# height, head-camera jitter -- comes from `_env_rng` (envs/_base_task.py), which under the task
# config's `env_seed` is rebuilt identically at every episode, so a run with `env_seed` set
# renders the same room in every episode, held-out ones included. With `env_seed: null` that
# generator is the global one, seeded from the episode's own seed, so the scene already varies
# episode to episode within the run and one seed is as good as another -- nothing about a seed's
# magnitude biases the draw.
eval_seed: null

# ===== Crash recovery =====
# Every finished episode is committed to the run directory as it completes: its row is appended
# to _episode_results.csv, the online critic (params AND Adam state) is checkpointed, and
# resume_state.json records the loop counters -- so an interrupted run keeps the episodes it
# already paid for.
#
# `resume: true` then continues the newest interrupted run for this task/policy/config/ckpt in
# its existing directory instead of opening a new timestamped one: the seed sequence carries on
# where it stopped (it cannot be recomputed -- which seeds the expert check rejected is not a
# function of the episode index), the critic reloads with its optimizer and LR schedule intact,
# the guidance ramp picks up where it stopped rather than restarting at 0, and the W&B run is
# rejoined. The replay buffer is NOT checkpointed (it is gigabytes of SigLIP
# features), so a resumed critic refills it from empty before TD updates restart.
# `false` always starts a fresh run and leaves any interrupted one untouched.
#
# `resume: "<run dir>"` continues that specific run instead of the newest. Use it when another
# eval is writing into the same task/policy/config/ckpt directory -- it rewrites its own
# resume_state.json every episode, so it stays the "newest" one however long ago yours stopped.
# (A run that predates crash recovery has no resume_state.json at all; script/
# resume_state_from_log.py rebuilds one from that run's SLURM log.)
resume:

# ===== Online QMFM Value critic =====
# `guidance_scale` is QMFM's steering_coeff. It and `best_of_n` (below) are the two ways the
# critic can act on sampling, and the online path is on when EITHER is set -- only
# `guidance_scale: 0` together with `best_of_n: 1` is the plain pi0.5 baseline, with no critic
# built, no replay collection, no TD updates and no W&B logging.
#   0.0     -> the sampler is not steered (but see `best_of_n`).
#   nonzero -> an ensemble `Value` critic (multisensory_steering) is trained ONLINE by TD
#              during the eval rollouts and steers the frozen pi0.5 flow sampler via QMFM
#              denoised-estimate gradient guidance (see `Pi0.sample_actions`).
# Guidance starts at 0 and ramps linearly to `guidance_scale` over `guidance_ramp_updates` TD
# updates *of this run* (0 = jump to the target after the first update). A critic warm-started
# from `critic_ckpt` ramps in the same way -- its restored update counter does not count. A
# *resumed* run is the same run, though, so it carries on from the ramp position it stopped at
# (`critic_ramp_baseline` in resume_state.json) instead of climbing the ramp a second time.
# Both are overridable as eval.sh's 7th / 8th positional args.
#
# Whether that critic also *learns* here is `train_online` in the `critic_config_path` file
# below, with `freeze_encoder` next to it for the half-way point (keep the checkpoint's
# observation encoder, keep training the value head). `train_online: false` freezes the critic
# at `critic_ckpt` entirely: it still steers, but nothing is stashed into the replay buffer and
# no TD update runs, so guidance sits at `guidance_scale` from the first chunk (there are no
# updates to ramp against) and `guidance_ramp_updates` is ignored. Overridable as eval.sh's 9th
# positional arg, or by setting `train_online` here -- this file wins over the included one.
#
# `best_of_n` is the second way the critic can act on sampling, independent of the gradient
# guidance:
#   1       -> off; the sampler returns the one chunk it drew.
#   n > 1   -> n candidate chunks are drawn from independent noise in a single sampler call and
#              the one with the highest ensemble-mean Q is executed. That is the chunk the
#              replay buffer stores and the Q log records, so everything downstream is about
#              the action that actually ran.
# It needs the same critic, so `best_of_n > 1` builds (and by default TD-trains) one even at
# `guidance_scale: 0` -- that combination is best-of-N over the *unmodified* pi0.5 sampler,
# which is cheaper per candidate than steering. With both on, every candidate is steered and
# the best steered chunk wins; the ramp applies to the guidance half exactly as below.
# Cost: the SigLIP tower and the prefix pass are shared across candidates, so only the
# denoising loop and the prefix KV cache scale with n. Overridable as eval.sh's 11th arg.
best_of_n: 1
guidance_scale: 0.05
guidance_ramp_updates: 500
# The reward the run scores itself with -- what `commit()` feeds the online critic, what the
# W&B reward curves and the per-episode `reward` column in _episode_results.csv measure:
#   true  -> 1.0 on the step that first reaches success, plus the task's own shaped progress
#            term (`step_reward()`, a delta; tasks that define none contribute 0.0).
#   false -> sparse: 1.0 on success, 0.0 everywhere else, even for a task that defines shaping.
# Unlike the keys above this also applies to the unguided baseline. eval.sh's 10th positional
# arg overrides it.
use_step_reward: false
# ===== Demo retrieval (action_proposals / noise_proposals) =====
# Which demonstrations the two proposal modalities are retrieved from, and how. Whether they are
# produced at all is the *task config's* `data_type.action_proposals` / `data_type.noise_proposals`
# (both default false) -- this block only says where they come from, and is ignored when neither
# flag is set or when no critic is running to consume them.
#
# Once per run (on the first episode): `num_demos` episodes of the task under evaluation are
# drawn at random from `repo_id` (matched by RoboTwin *task*, not by instruction string -- one
# task expands into hundreds of instructions), and every frame of them is encoded into a bank.
# That bank is then FIXED for the whole run -- it is a critic input, so re-drawing it partway
# through would move what the critic is conditioned on. Per control step:
# the `top_k` bank frames most cosine-similar to the current observation (mean over `views` of
# the pooled SigLIP embeddings) contribute their demo action chunk as `action_proposals`, and --
# when that flag is on -- the noise that would make *this* observation's sampler produce that
# chunk as `noise_proposals` (Pi0.invert_actions).
#
# Cost: `noise_proposals` runs the flow inversion, num_steps x num_inner_steps action-expert
# passes at batch top_k per control step, which is the most expensive thing in the step.
# `action_proposals` alone costs only the retrieval (one extra image tower + prefix pass).
demo_retrieval:
  # The LeRobot dataset the demonstrations come from -- normally the one the policy was
  # fine-tuned on, so a retrieved chunk is something the policy could plausibly produce.
  repo_id: NatashaYang/robotwin_demo_clean_50_lerobot
  # Where that dataset lives; null = $HF_LEROBOT_HOME/<repo_id>.
  root: null
  # Demonstrations drawn for the run (once, not per episode), and neighbours retrieved per
  # control step. `top_k` is a *candidate pool* for a critic whose proposal encoder is
  # `attn_proposals` (the default): the distance picks which rows are on offer -- inverting a
  # chunk costs an action-expert pass, which is why the pool is not the whole bank -- and the
  # critic cross-attends them to decide what the value actually rests on. A critic that pools
  # the set instead gets exactly these `top_k` and no say in it.
  num_demos: 1
  top_k: 3
  # Camera views the similarity is averaged over; null = all three the policy sees.
  views: null
  # What the similarity ranks by. Each entry contributes one independent cosine and they are
  # averaged with EQUAL weight, so adding one dilutes the others: `siglip` expands to one term
  # per camera view (three by default) and `state` adds a fourth on the robot's pose in the
  # model's normalized space. null = both; `[siglip]` is vision only. `siglip` is required.
  # (Contact wrench would be the natural third signal but no demo dataset carries it -- the
  # RoboTwin collection pipeline computes it live and never persists it.)
  signals: null
  # Recorded sensors to keep per bank row, on top of the camera views, the pose and the contact
  # wrench. These are what lets **any** modality a demo dataset carries be a cross-attention key
  # (`critic_keys`) or a co-training column (`cotrain_rows`), not just `siglip.<view>` /
  # `state` / `wrench.<key>`: name them here and a retrieved demo frame serves its own
  # `depth.head`, `pointcloud`, raw `images.<cam>`, ... under the same modality names the live
  # observation uses.
  #
  # Which ones exist follows the dataset, and it is checked at startup: the rgb-only converter
  # writes three camera views, the multimodal one adds `depth.<cam>`, `pointcloud` and a fourth
  # `front` camera. `null` (or []) keeps none, which is exactly the behaviour before this key
  # existed; `true` keeps everything the dataset has.
  #
  # Opt-in because unlike a SigLIP map these cannot be re-encoded from something smaller -- they
  # are resident for every bank row (~0.23 MB a camera frame, ~0.15 MB a depth map, ~24 KB a
  # point cloud), so the cost scales with `num_demos` x episode length, not with `top_k`. The
  # bank banner prints the total.
  #
  # A shape mismatch is the thing to watch: a demo frame has to be the same array the sim hands
  # the critic online. The rgb-only demo datasets store 480x640 frames against the sim's
  # 240x320, so their `images.<cam>` is NOT a usable key; the multimodal ones store 240x320 and
  # are. Nothing here can check it -- the online shape is not known until the first observation
  # -- so a mismatch surfaces in the critic's encoder.
  sensor_modalities: null
  # The bank is a jit argument, so it is padded to a fixed size (padding can never be
  # retrieved). Raise it if `num_demos` x episode length overflows and frames get subsampled.
  # This is also the run's biggest memory item: every row keeps its SigLIP patch map per view
  # so a cross-attending critic can encode a demo frame the way it encodes a live one, which is
  # ~0.6 MB per view per row at fp16 -- 1.8 GB here, at 1000 rows over three cameras. Lower it
  # (or `views`) if that is too much; `frame_stride` shrinks it for free when the demos are
  # longer than the bank anyway.
  bank_size: 1000
  # Keep every Nth demo frame. >1 shrinks the bank and the per-episode encoding cost.
  frame_stride: 1
  # Inversion settings for `noise_proposals`. `num_steps` MUST match the sampler's denoising
  # step count, or the noise inverts a different map than the one it will be fed to.
  num_steps: 10
  num_inner_steps: 1
  # Demo frames encoded per image-tower call while building a bank.
  encode_batch_size: 16
  # How many matches the debug visualization draws per control step, independent of `top_k`
  # (the similarity over the whole bank comes back anyway, so deeper ranks are free). Only used
  # when the task config sets `debug: true`; see debug_vis/episode<N>/retrieval_*.
  debug_top_k: 3
  # Which demonstrations get drawn; null = the run's `seed`.
  seed: null

# Warm-start the critic from an offline-trained checkpoint (null = train from scratch online).
critic_ckpt: "eval_result/open_microwave/pi05/demo_clean/robotwin_clean_ep25/2026-08-10 16:39:50/online_value_critic.pkl"
# Everything below only takes effect when a critic is running, i.e. guidance_scale != 0 or
# best_of_n > 1.
# Critic network / TD / replay / W&B knobs are merged in from this file; anything set above
# (or overridden on the eval.sh command line) wins over it.
critic_config_path: /home/natashay/projects/aip-florian7/natashay/multisensory-steering/cfgs/qmfm.yaml
