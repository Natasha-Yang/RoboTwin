# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
# Same scene in every episode of the run (textures/lights/table height/camera jitter drawn from
# this seed instead of the episode's); null = redraw per episode. See _config_template.yml.
env_seed: null
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.02
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.02
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  wrench: true
  # Demo-retrieval proposals for a steering critic: the top-K demonstration frames most similar
  # to the current observation contribute their action chunks (`action_proposals`) and the noise
  # seeds that reproduce those chunks under this observation (`noise_proposals`). Unlike every
  # flag above, these are produced by the policy rather than the sim -- configure which demo
  # dataset they come from under `demo_retrieval` in policy/pi05/deploy_policy.yml. Consumed
  # only by a critic, so both are ignored by a run that has none.
  action_proposals: false
  noise_proposals: false
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
# Eval debug output (see visualize_debug_obs in script/eval_policy.py): TCP wrench
# histograms + a rollout/wrench GIF per episode, alongside the episode videos. Depth /
# point-cloud dumps are added on top when the data_type flags above enable them.
debug: false
